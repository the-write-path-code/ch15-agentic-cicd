name: migration

on:
  workflow_dispatch:
    inputs:
      candidate:
        description: "Candidate trace fixture name (e.g. traces_candidate_v1) or path"
        required: true
        default: traces_candidate_v1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  migration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
      - name: Sync locked environment
        run: uv sync --locked
      - name: Replay candidate against baseline
        run: uv run python scripts/swap_model.py --candidate "${{ inputs.candidate }}"
      - name: Upload migration report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: migration-report
          path: reports/migration_report.md

  live-traces:
    name: Record live traces (optional, secrets-gated)
    runs-on: ubuntu-latest
    needs: migration
    if: ${{ vars.RECORD_LIVE_TRACES == 'true' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
      - name: Sync locked environment with live extra
        run: uv sync --locked --extra live
      - name: Record live traces against Gemini
        if: ${{ secrets.GEMINI_API_KEY != '' }}
        run: uv run python scripts/run_eval.py --mode live
        env:
          day2ops_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Record live traces against Ollama
        if: ${{ secrets.GEMINI_API_KEY == '' }}
        run: echo "Set GEMINI_API_KEY (or configure an Ollama endpoint) to record live traces."
