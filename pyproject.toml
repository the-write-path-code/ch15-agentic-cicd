[project]
name = "day2ops"
version = "0.1.0"
description = "Chapter 15 companion: CI/CD merge gates for a non-deterministic agentic RAG system (The Write Path, Apress)."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "rank-bm25>=0.2.2",
]

[project.optional-dependencies]
live = ["ollama>=0.3", "google-genai>=1.0"]
ragas = ["ragas>=0.2"]
telemetry = ["opik>=1.0", "prometheus-client>=0.20"]

[dependency-groups]
dev = ["pytest>=8.2", "ruff>=0.5", "mypy>=1.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/day2ops"]

[tool.pytest.ini_options]
addopts = "-m 'not live'"
markers = ["live: tests that require network access or a live model server"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
